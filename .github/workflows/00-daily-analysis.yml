name: 每日股票分析

on:
  schedule:
    # UTC 時間每日 0:00 執行 (台灣時間上午 8:00)
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      analysis_mode:
        description: '分析模式 (full: 完整分析, stocks-only: 僅股票, market-only: 僅大盤)'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - stocks-only
          - market-only
      force_run:
        description: '强制运行（跳过交易日检查）'
        required: false
        default: false
        type: boolean

jobs:
  analyze:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: 檢查程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 安裝依賴套件
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 執行股票分析與推播
        env:
          # API Key 與 Telegram 設定
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          
          # 股票與市場設定 (優先讀取 Variables/Secrets，否則使用預設值)
          STOCK_LIST: ${{ vars.STOCK_LIST || secrets.STOCK_LIST || '0056.TW' }}
          MARKET_REVIEW_REGION: ${{ vars.MARKET_REVIEW_REGION || secrets.MARKET_REVIEW_REGION || 'tw' }}
          
          # 觸發條件控制
          ANALYSIS_MODE: ${{ inputs.analysis_mode || 'full' }}
          FORCE_RUN: ${{ inputs.force_run || false }}
        run: |
          echo "開始執行股票分析..."
          python main.py
